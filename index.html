<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JavaScript & Node.js — How they actually work</title>
<style>
  :root{
    --bg:#12161C; --panel:#181D25; --panel2:#1E252F; --line:#2A323E;
    --text:#E8EAED; --sub:#8B94A3;
    --js:#F2C879; --jsbg:#2C2413;
    --node:#4FCB8F; --nodebg:#152A22;
    --accent:#5B8CFF; --accentbg:#182335;
    --tick:#F26B6B; --tickbg:#2C1717;
    --micro:#C58CF2; --microbg:#241A2E;
    --pool:#5BD6D6; --poolbg:#12292C;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box}
  button{font-family:inherit}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--mono)}
  a{color:inherit}

  .scanlines{position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.035;
    background:repeating-linear-gradient(0deg, #fff 0px, #fff 1px, transparent 1px, transparent 3px)}

  .term-chrome{background:#0D1013;border-bottom:1px solid var(--line);padding:8px 16px;display:flex;align-items:center;gap:14px;font-size:11.5px}
  .term-dots{display:flex;gap:6px;flex:none}
  .term-dots .d{width:10px;height:10px;border-radius:50%;display:block}
  .term-dots .d.red{background:#F26B6B} .term-dots .d.yellow{background:#F2B84B} .term-dots .d.green{background:#4FCB8F}
  .term-path{color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .term-path .sep{color:#3A4454}
  .term-path .cmd{color:var(--node)}
  .cursor{display:inline-block;width:7px;height:13px;background:var(--node);margin-left:4px;vertical-align:-2px;animation:blink 1s step-end infinite}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

  h1 .prompt{color:var(--node);margin-right:6px}

  /* Top nav */
  .topbar{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:0 20px;display:flex;align-items:center;gap:4px;height:56px}
  .topbar h1{font-size:14.5px;font-weight:600;margin:0 18px 0 0;white-space:nowrap}
  .tab{padding:8px 18px;border-radius:8px;font-size:13.5px;font-weight:600;cursor:pointer;border:1px solid transparent;color:var(--sub);transition:all .25s}
  .tab.js.active{background:var(--jsbg);color:var(--js);border-color:#6B551F}
  .tab.node.active{background:var(--nodebg);color:var(--node);border-color:#2C5C46}
  .tab:not(.active):hover{color:var(--text)}

  .shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - 56px)}
  @media (max-width:820px){.shell{grid-template-columns:1fr}}

  /* Sidebar */
  .sidebar{border-right:1px solid var(--line);padding:18px 10px;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto}
  @media (max-width:820px){.sidebar{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px}}
  .side-item{display:block;width:100%;text-align:left;background:none;border:none;color:var(--sub);font-family:var(--mono);font-size:13px;padding:9px 12px;border-radius:8px;cursor:pointer;margin-bottom:2px;transition:all .2s}
  @media (max-width:820px){.side-item{width:auto}}
  .side-item .n{font-family:var(--mono);font-size:10px;color:var(--sub);opacity:.6;margin-right:6px}
  .side-item:hover{background:var(--panel2);color:var(--text)}
  .side-item.active.js{background:var(--jsbg);color:var(--js)}
  .side-item.active.node{background:var(--nodebg);color:var(--node)}

  /* Main content */
  main{padding:28px 30px 80px;max-width:760px}
  @media (max-width:600px){main{padding:22px 16px 60px}}
  .section{display:none}
  .section.active{display:block;animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px}
  .eyebrow.js{color:var(--js)} .eyebrow.node{color:var(--node)}
  h2{font-size:22px;font-weight:600;margin:0 0 10px}
  h2::before{content:'> ';color:var(--node)}
  .lede{color:var(--sub);font-size:14.5px;line-height:1.65;margin:0 0 22px}

  .visual{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:22px;margin-bottom:22px;display:flex;align-items:center;justify-content:center;min-height:120px}

  h3{font-size:14px;font-weight:600;margin:26px 0 10px;color:var(--text)}
  p{font-size:14px;line-height:1.7;color:#C9CDD6;margin:0 0 12px}
  code{background:#0D1013;padding:1.5px 6px;border-radius:5px;font-family:var(--mono);font-size:12.5px;color:#EAD9A0}

  .steps{list-style:none;margin:0;padding:0;counter-reset:step}
  .steps li{counter-increment:step;position:relative;padding:4px 0 14px 34px;font-size:14px;line-height:1.65;color:#C9CDD6}
  .steps li::before{content:counter(step);position:absolute;left:0;top:2px;width:22px;height:22px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--text);font-family:var(--mono);font-size:11px;display:flex;align-items:center;justify-content:center}
  .steps li b{color:var(--text)}

  pre{background:#0D1013;border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;line-height:1.7;margin:14px 0}
  pre code{background:none;padding:0;color:#C6E27C}
  .kw{color:#7EA6F2}.fn{color:#F2C879}.str{color:#C6E27C}.cm{color:#5F6B7A}

  .callout{border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.6;margin:16px 0;border:1px solid}
  .callout.warn{background:#2C2413;border-color:#6B551F;color:#F6D999}
  .callout.info{background:#182335;border-color:#2E4A82;color:#BFD3FF}

  .term-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
  @media (max-width:520px){.term-grid{grid-template-columns:1fr}}
  .term{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;transition:border-color .2s}
  .term[open]{border-color:var(--accent)}
  .term summary{cursor:pointer;list-style:none;display:flex;flex-direction:column;gap:3px}
  .term summary::-webkit-details-marker{display:none}
  .term summary .t-head{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text)}
  .term summary .t-head::before{content:'▸';color:var(--sub);font-size:10px;transition:transform .2s}
  .term[open] summary .t-head::before{content:'▾'}
  .term summary .t-desc{font-size:12px;color:var(--sub);line-height:1.5}
  .term-expand{padding-top:10px;margin-top:8px;border-top:1px solid var(--line);animation:termReveal .3s ease}
  .term-expand p{font-size:12.5px;line-height:1.6;color:#C9CDD6;margin:0 0 8px}
  .term-expand pre{margin:0;font-size:11.5px}
  @keyframes termReveal{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}

  .nav-footer{display:flex;justify-content:space-between;margin-top:34px;border-top:1px solid var(--line);padding-top:18px}
  .nav-footer button{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:9px 15px;border-radius:6px;font-size:13px;cursor:pointer;font-family:var(--mono)}
  .nav-footer button:not(:disabled)::before{content:'[ ';color:var(--sub)}
  .nav-footer button:not(:disabled)::after{content:' ]';color:var(--sub)}
  .nav-footer button:hover{border-color:#3A4454}
  .nav-footer button:disabled{opacity:.3;cursor:default}

  /* --- animated visuals --- */
  .stack-anim{display:flex;flex-direction:column-reverse;gap:5px;width:150px}
  .stack-anim div{height:22px;border-radius:5px;background:var(--accentbg);border:1px solid #2E4A82;animation:stackPulse 2.4s ease-in-out infinite}
  .stack-anim div:nth-child(2){animation-delay:.3s}
  .stack-anim div:nth-child(3){animation-delay:.6s}
  @keyframes stackPulse{0%,100%{opacity:.5;transform:scaleX(.9)}50%{opacity:1;transform:scaleX(1)}}

  .heap-anim{position:relative;width:180px;height:100px}
  .heap-anim i{position:absolute;border-radius:50%;background:var(--nodebg);border:1px solid #2C5C46;display:block;animation:float 3.2s ease-in-out infinite}
  .heap-anim i:nth-child(1){width:34px;height:34px;left:10px;top:30px;animation-delay:0s}
  .heap-anim i:nth-child(2){width:22px;height:22px;left:70px;top:8px;animation-delay:.5s}
  .heap-anim i:nth-child(3){width:44px;height:44px;left:100px;top:40px;animation-delay:1s}
  .heap-anim i:nth-child(4){width:18px;height:18px;left:60px;top:70px;animation-delay:1.5s}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

  .loop-anim{width:110px;height:110px;border-radius:50%;border:3px solid var(--line);position:relative}
  .loop-anim::before{content:'';position:absolute;top:-3px;left:-3px;width:100%;height:100%;border-radius:50%;border:3px solid transparent;border-top-color:var(--js);animation:spin 2.6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .chain-anim{display:flex;align-items:center;gap:6px}
  .chain-anim div{padding:8px 12px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--sub);animation:glow 2.4s ease-in-out infinite}
  .chain-anim div:nth-child(1){animation-delay:0s}
  .chain-anim div:nth-child(2){animation-delay:.4s}
  .chain-anim div:nth-child(3){animation-delay:.8s}
  @keyframes glow{0%,100%{border-color:var(--line);color:var(--sub)}50%{border-color:var(--js);color:var(--js)}}

  .thread-anim{display:flex;gap:8px}
  .thread-anim div{width:28px;height:44px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);animation:busy 3s ease-in-out infinite}
  .thread-anim div:nth-child(1){animation-delay:0s}
  .thread-anim div:nth-child(2){animation-delay:.7s}
  .thread-anim div:nth-child(3){animation-delay:1.4s}
  .thread-anim div:nth-child(4){animation-delay:2.1s}
  @keyframes busy{0%,20%,100%{background:var(--panel2);border-color:var(--line)}10%{background:#12292C;border-color:#5BD6D6}}

  .buf-anim{display:flex;gap:3px}
  .buf-anim div{width:14px;height:34px;border-radius:3px;background:var(--nodebg);border:1px solid #2C5C46;animation:fill 2s ease-in-out infinite}
  .buf-anim div:nth-child(odd){animation-delay:.15s}
  @keyframes fill{0%,100%{opacity:.35}50%{opacity:1}}

  .stream-anim{position:relative;width:200px;height:24px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
  .stream-anim i{position:absolute;top:3px;left:-16px;width:16px;height:16px;border-radius:50%;background:var(--node);animation:travel 2.2s linear infinite}
  .stream-anim i:nth-child(2){animation-delay:.7s}
  .stream-anim i:nth-child(3){animation-delay:1.4s}
  @keyframes travel{to{left:calc(100% + 16px)}}

  .thisflip-anim{display:flex;align-items:center;gap:14px}
  .tf-box{padding:10px 16px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-family:var(--mono);font-size:13px;color:var(--sub);animation:tfpulse 2.4s ease-in-out infinite}
  .tf-box.b{background:var(--jsbg);border-color:#6B551F;color:var(--js);animation-delay:.4s}
  .tf-arrow{color:var(--sub);font-size:18px;animation:tfarrow 2.4s ease-in-out infinite}
  @keyframes tfpulse{0%,100%{opacity:.5}50%{opacity:1}}
  @keyframes tfarrow{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}

  .sweep-anim{display:flex;gap:10px}
  .sweep-anim i{width:26px;height:26px;border-radius:50%;display:block}
  .sweep-anim i.live{background:var(--nodebg);border:1px solid var(--node);animation:livepulse 2.4s ease-in-out infinite}
  .sweep-anim i.dead{background:var(--panel2);border:1px solid var(--line);animation:sweepfade 2.4s ease-in-out infinite}
  @keyframes livepulse{0%,100%{opacity:1}50%{opacity:.6}}
  @keyframes sweepfade{0%,40%{opacity:.7}60%,100%{opacity:.1}}

  .hoist-anim{position:relative;width:200px;height:110px}
  .hoist-top{position:absolute;top:0;left:0;right:0;text-align:center;font-family:var(--mono);font-size:10px;color:var(--sub);border-bottom:1px dashed var(--line);padding-bottom:6px}
  .hoist-chip{position:absolute;left:50%;transform:translateX(-50%);padding:5px 10px;border-radius:6px;font-family:var(--mono);font-size:11px;white-space:nowrap;animation:rise 2.8s ease-in infinite}
  .hoist-chip.v{background:var(--accentbg);border:1px solid #2E4A82;color:#BFD3FF;bottom:10px;animation-delay:0s}
  .hoist-chip.f{background:var(--nodebg);border:1px solid #2C5C46;color:#B9EBCE;bottom:10px;animation-delay:1.4s}
  @keyframes rise{0%{bottom:10px;opacity:0}15%{opacity:1}90%{bottom:80px;opacity:1}100%{bottom:80px;opacity:0}}

  .protochain-anim{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center}
  .pc-node{padding:6px 9px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);font-family:var(--mono);font-size:10px;color:var(--sub);animation:pcglow 3.2s ease-in-out infinite}
  .pc-node.end{color:var(--sub)}
  .pc-arrow{color:var(--sub);font-size:12px}
  .protochain-anim .pc-node:nth-child(1){animation-delay:0s}
  .protochain-anim .pc-node:nth-child(3){animation-delay:.5s}
  .protochain-anim .pc-node:nth-child(5){animation-delay:1s}
  .protochain-anim .pc-node:nth-child(7){animation-delay:1.5s}
  @keyframes pcglow{0%,85%,100%{border-color:var(--line);color:var(--sub)}15%{border-color:var(--accent);color:var(--accent)}}

  .taskqueue-anim{display:flex;flex-direction:column;gap:10px;width:180px}
  .tq-row{display:flex;align-items:center;gap:6px}
  .tq-label{font-family:var(--mono);font-size:10px;color:var(--sub);width:40px}
  .tq-row i{width:12px;height:12px;border-radius:50%;background:var(--microbg);border:1px solid #5A3F73;display:block}
  .tq-row:last-child i{background:var(--jsbg);border-color:#6B551F}
  .tq-row:first-child i{animation:tqfast 1.1s ease-in-out infinite}
  .tq-row:first-child i:nth-child(3){animation-delay:.15s}
  .tq-row:first-child i:nth-child(4){animation-delay:.3s}
  .tq-row:last-child i{animation:tqslow 2.6s ease-in-out infinite}
  @keyframes tqfast{0%,100%{opacity:.3}50%{opacity:1}}
  @keyframes tqslow{0%,100%{opacity:.3}50%{opacity:1}}

  .enginemerge-anim{position:relative;width:200px;height:70px}
  .em-box{position:absolute;top:8px;padding:8px 12px;border-radius:6px;font-family:var(--mono);font-size:11px;border:1px solid;animation:emmerge 3s ease-in-out infinite}
  .em-box.v8{left:0;background:var(--accentbg);border-color:#2E4A82;color:#BFD3FF}
  .em-box.libuv{right:0;background:var(--nodebg);border-color:#2C5C46;color:#B9EBCE;animation-delay:0s}
  .em-result{position:absolute;bottom:0;left:50%;transform:translateX(-50%);padding:6px 12px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--sub);opacity:0;animation:emresult 3s ease-in-out infinite}
  @keyframes emmerge{0%,20%{left:0}45%,55%{left:38%}80%,100%{left:0}}
  .em-box.libuv{animation-name:emmerge2}
  @keyframes emmerge2{0%,20%{right:0}45%,55%{right:38%}80%,100%{right:0}}
  @keyframes emresult{0%,40%{opacity:0}55%,75%{opacity:1}100%{opacity:0}}

  .moduleflow-anim{display:flex;flex-direction:column;gap:14px;width:200px}
  .mf-row{position:relative;display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--sub);height:20px}
  .mf-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);position:absolute;left:0}
  .mf-row.sync .mf-dot{animation:mfsync 1.6s linear infinite}
  .mf-row.async .mf-dot{background:var(--node);animation:mfasync 2.8s linear infinite}
  @keyframes mfsync{0%{left:0;opacity:1}90%{left:130px;opacity:1}100%{left:130px;opacity:0}}
  @keyframes mfasync{0%,20%{left:0;opacity:.4}90%{left:130px;opacity:1}100%{left:130px;opacity:0}}

  .nexttick-anim{position:relative;display:flex;gap:8px;align-items:center;height:40px}
  .nt-chip{padding:6px 10px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);font-family:var(--mono);font-size:10px;color:var(--sub)}
  .nt-chip.priority{background:var(--tickbg);border-color:#6B2E2E;color:#F5B9B9;position:relative;animation:jumpqueue 2.6s ease-in-out infinite}
  @keyframes jumpqueue{0%,10%{order:3;transform:translateX(0)}50%{order:0;transform:translateX(-4px)}90%,100%{order:0;transform:translateX(0)}}
  .nexttick-anim{display:flex}

  .clusterproc-anim{display:flex;gap:12px}
  .cp-proc{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-family:var(--mono);font-size:9px;color:var(--sub)}
  .cp-proc i{width:10px;height:10px;border-radius:50%;background:var(--pool);display:block;animation:cppulse 2.4s ease-in-out infinite}
  .cp-proc:nth-child(1) i{animation-delay:0s}
  .cp-proc:nth-child(2) i{animation-delay:.6s}
  .cp-proc:nth-child(3) i{animation-delay:1.2s}
  @keyframes cppulse{0%,100%{opacity:.3}50%{opacity:1}}

  .nonblock-anim{width:200px}
  .nb-pipe{position:relative;height:24px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
  .nb-pipe i{position:absolute;top:3px;left:-16px;width:16px;height:16px;border-radius:50%;background:var(--accent);animation:nbflow 1.8s linear infinite}
  .nb-pipe i:nth-child(2){animation-delay:.4s}
  .nb-pipe i:nth-child(3){animation-delay:.8s}
  @keyframes nbflow{to{left:calc(100% + 16px)}}

  /* --- badge for demo items in sidebar --- */
  .side-item .play-badge{display:inline-block;margin-left:6px;font-size:9px;padding:1px 6px;border-radius:10px;background:var(--accentbg);color:var(--accent);vertical-align:middle}

  /* --- demo player --- */
  .dp-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px}
  @media (max-width:700px){.dp-layout{grid-template-columns:1fr}}
  .dp-code{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 0;font-family:var(--mono);font-size:11.5px;line-height:1.8;height:fit-content;position:sticky;top:70px;min-width:0;max-width:260px;overflow-x:auto}
  @media (max-width:700px){.dp-code{position:static;max-width:100%}}
  .dp-code-line{padding:1px 12px;white-space:pre;color:#7D8798;transition:background .3s,color .3s;width:max-content;min-width:100%}
  .dp-code-line.active{background:#26313F;color:#EAF1FF;border-left:2px solid var(--accent)}

  .dp-ring{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
  .dp-phase{flex:1;min-width:78px;text-align:center;font-family:var(--mono);font-size:10px;padding:7px 3px;border-radius:7px;border:1px solid var(--line);color:var(--sub);transition:all .3s;font-weight:600}
  .dp-phase.on{color:#0D1013;border-color:transparent;transform:scale(1.03)}

  .dp-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  .dp-row.three{grid-template-columns:1fr 1fr 1fr}
  @media (max-width:560px){.dp-row,.dp-row.three{grid-template-columns:1fr}}
  .dp-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:70px}
  .dp-card h4{margin:0 0 7px;font-size:10.5px;font-weight:600;letter-spacing:.2px;text-transform:uppercase;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--sub)}
  .dp-dot{width:7px;height:7px;border-radius:50%;flex:none}
  .dp-items{display:flex;flex-direction:column;gap:5px}

  .dp-frame{border-radius:6px;padding:6px 9px;font-family:var(--mono);font-size:11px;animation:dpop .3s ease;border:1px solid;display:flex;justify-content:space-between;gap:6px}
  @keyframes dpop{from{opacity:0;transform:translateY(6px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
  .dp-frame.stack{background:var(--accentbg);border-color:#2E4A82;color:#BFD3FF}
  .dp-frame.heap{background:var(--nodebg);border-color:#2C5C46;color:#B9EBCE}
  .dp-frame.tick{background:var(--tickbg);border-color:#6B2E2E;color:#F5B9B9}

{ id:'exec', title:'Execution context & call stack', animate:'stack',
  lede:"Every time JS runs code, it does so inside an execution context — a box holding variables, scope, and 'this'. Contexts stack on top of each other.",
  steps:[
    "The <b>Global Execution Context</b> is created first and pushed onto the call stack — this holds top-level code.",
    "Whenever a function is called, a new <b>Function Execution Context</b> is created and pushed on top.",
    "That context has two phases: <b>creation</b> (hoist variables/functions, set up scope and 'this') then <b>execution</b> (run line by line).",
    "When the function returns, its context is <b>popped</b> off the stack, and control resumes wherever it left off below.",
    "The stack has a size limit — unbounded recursion pushes contexts faster than they pop, producing a <b>'Maximum call stack size exceeded'</b> error.",
    "Each context also tracks a <b>variable environment</b> (its own local variables) and an <b>outer reference</b> to the scope it was defined in — this outer link is what makes closures possible.",
    "Stack traces in error messages are literally a printout of the call stack at the moment of the error — reading them top-to-bottom tells you the exact call chain that led there.",
    "JS engines don't reliably optimize tail calls despite it being in the ES2015 spec — writing 'tail-recursive' code in JS still risks a real stack overflow, unlike in languages that guarantee tail-call optimization."
  ],
  code:`function greet(name) {\n  return 'hi ' + name;\n}\ngreet('Gayan'); <span class="cm">// pushes greet's context, then pops it</span>`,
  terms:[
    {term:"Execution context", desc:"A container tracking variables, scope chain, and 'this' for a running block of code.", detail:"Every context goes through a creation phase (hoisting, scope setup) before a single line executes — that's why declarations can be 'seen' before their line runs.", code:`function outer() {\n  function inner() { return 'hi'; }\n  return inner();  <span class="cm">// inner() gets its own execution context</span>\n}`},
    {term:"Call stack", desc:"LIFO structure tracking which execution context is currently active.", detail:"Reading a stack trace top-to-bottom shows you the exact chain of calls that led to where you are right now — innermost call first.", code:`function a(){ b(); }\nfunction b(){ c(); }\nfunction c(){ console.trace(); }\na();  <span class="cm">// trace shows: c, b, a</span>`},
    {term:"Stack overflow", desc:"Happens when contexts push faster than they pop — e.g. infinite/unbounded recursion.", detail:"JS engines don't guarantee tail-call optimization, so even a 'clean' recursive function can blow the stack on large inputs.", code:`function count(n) {\n  return count(n + 1);  <span class="cm">// no base case</span>\n}\ncount(0); <span class="cm">// RangeError: Maximum call stack size exceeded</span>`}
  ]
},
{ id:'memory', title:'Memory: stack vs heap', animate:'heap',
  lede:"JS has two very different memory regions, and confusing them is one of the most common interview trip-ups.",
  steps:[
    "<b>Primitives</b> (number, string, boolean, null, undefined, symbol, bigint) are stored directly in the <b>stack</b>, inside the execution context.",
    "<b>Objects, arrays, and functions</b> are allocated in the <b>heap</b> — a large, less-structured memory region.",
    "A variable referencing an object doesn't hold the object — it holds a <b>reference (pointer)</b> to its heap address.",
    "This is why objects are <b>copied by reference</b> and primitives are <b>copied by value</b> when assigned or passed to a function.",
    "Primitives are also <b>immutable</b> — string methods like <code>.toUpperCase()</code> don't change the original, they return a brand-new value.",
    "Comparing two objects with <code>===</code> checks whether they're the <b>same heap reference</b>, not whether their contents look equal — two identical-looking objects are still unequal.",
    "The stack is fast because its size is known at compile time and it's cleaned up automatically as contexts pop; the heap needs a garbage collector precisely because object lifetimes aren't predictable.",
    "<code>Object.freeze()</code> only prevents reassigning an object's own top-level properties — it's shallow, so a frozen object can still have a mutable nested object inside it."
  ],
  code:`let a = 10;          <span class="cm">// stack: primitive</span>\nlet obj = { x: 1 };  <span class="cm">// heap: object, stack holds a pointer</span>\nlet obj2 = obj;       <span class="cm">// copies the pointer, not the object</span>\nobj2.x = 99;          <span class="cm">// obj.x is 99 too — same heap object</span>`,
  terms:[
    {term:"Stack memory", desc:"Fixed-size, fast, automatically managed as contexts push/pop.", detail:"Because its layout is predictable, allocating and freeing stack memory is essentially free compared to heap allocation.", code:`function add(a, b) {\n  const sum = a + b;   <span class="cm">// sum lives in this frame's stack space</span>\n  return sum;\n}                       <span class="cm">// freed automatically when the frame pops</span>`},
    {term:"Heap memory", desc:"Large, dynamically allocated, managed by the garbage collector.", detail:"Heap allocation costs more than stack allocation, which is part of why creating huge numbers of small objects in a hot loop can hurt performance.", code:`function makeUser(name) {\n  return { name, createdAt: Date.now() };  <span class="cm">// allocated on the heap</span>\n}`},
    {term:"Pass by reference (sort of)", desc:"JS passes the reference by value — you can mutate the object, but reassigning the parameter doesn't affect the caller's variable.", detail:"This distinction — mutating vs reassigning — is one of the most common sources of confusion when reasoning about function side effects.", code:`function mutate(obj) { obj.x = 99; }      <span class="cm">// affects caller</span>\nfunction reassign(obj) { obj = { x: 1 }; } <span class="cm">// does NOT affect caller</span>\nconst o = { x: 0 };\nmutate(o); console.log(o.x);   <span class="cm">// 99</span>\nreassign(o); console.log(o.x); <span class="cm">// still 99</span>`}
  ]
},
{ id:'scope', title:'Scope, closures & the scope chain', animate:'chain',
  lede:"Closures are the single most-tested JS concept in coding assessments — they come from how scope is resolved, not memorized magic.",
  steps:[
    "Every function, when defined, remembers the <b>lexical scope</b> it was created in — not where it's called from.",
    "When a variable is referenced, JS looks it up through the <b>scope chain</b>: local → enclosing → ... → global.",
    "A <b>closure</b> is formed when an inner function is returned/passed out and keeps a live reference to its outer function's variables.",
    "Because that variable is still referenced, it <b>can't be garbage collected</b> — the closure keeps it alive on the heap even after the outer function has returned.",
    "This is also how private state works without classes — the classic <b>module pattern</b> hides variables that only inner functions can touch.",
    "Each function call creates a <b>brand-new scope</b> — calling <code>counter()</code> twice gives two independent closures, each with its own separate <code>count</code>.",
    "Block scope (<code>{ }</code> with <code>let</code>/<code>const</code>) is a more recent addition — <code>var</code> ignores block boundaries entirely and only respects function scope.",
    "Before <code>let</code>/<code>const</code> existed, an <b>IIFE</b> (Immediately Invoked Function Expression) was the standard trick for creating an isolated scope on the spot — you'll still see it in older codebases and some module bundler output."
  ],
  code:`function counter() {\n  let count = 0;                 <span class="cm">// captured by closure</span>\n  return () => ++count;\n}\nconst inc = counter();\ninc(); inc();                    <span class="cm">// 1, then 2 — count persists</span>`,
  terms:[
    {term:"Lexical scope", desc:"Scope determined by where code is physically written, not where it's called.", detail:"This is what makes closures predictable — you can always figure out what a function can 'see' just by reading its surrounding code, regardless of how it's later invoked.", code:`const x = 'outer';\nfunction show() { console.log(x); }  <span class="cm">// always sees the outer x</span>\nfunction wrapper() {\n  const x = 'inner';\n  show();  <span class="cm">// still logs 'outer' — lexical, not dynamic</span>\n}`},
    {term:"Closure", desc:"A function bundled with references to its surrounding state.", detail:"Every function in JS is technically a closure — most just don't capture anything interesting because they don't reference outer variables.", code:`function makeAdder(x) {\n  return y => x + y;   <span class="cm">// remembers x forever</span>\n}\nconst add5 = makeAdder(5);\nadd5(3);  <span class="cm">// 8</span>`},
    {term:"Scope chain", desc:"The lookup path JS follows to resolve a variable name.", detail:"Lookup always walks outward and stops at the first match — a variable in an inner scope 'shadows' (hides) one with the same name further out.", code:`let val = 'global';\nfunction outer() {\n  let val = 'outer';\n  function inner() {\n    console.log(val);   <span class="cm">// 'outer' — nearest match wins</span>\n  }\n  inner();\n}`}
  ]
},
{ id:'hoist', title:'Hoisting', animate:'hoist',
  lede:"Hoisting is a side effect of the creation phase of an execution context, not code being physically moved.",
  steps:[
    "During the <b>creation phase</b>, JS scans the code and registers all <code>var</code> and function declarations in memory first.",
    "<code>var</code> declarations are initialized to <code>undefined</code> immediately — accessible (but empty) before their line runs.",
    "Function declarations are hoisted <b>with their full body</b> — callable before they appear in the file.",
    "<code>let</code>/<code>const</code> are hoisted too, but stay in the <b>temporal dead zone</b> until their declaration line executes — accessing them earlier throws a ReferenceError.",
    "A function <i>expression</i> assigned to a var (<code>var f = function(){}</code>) is NOT hoisted with its body — only the <code>var f</code> part is, initialized to <code>undefined</code>.",
    "If a function declaration and a <code>var</code> share the same name, the <b>function wins</b> during hoisting — it gets registered after and overwrites the variable's initial value.",
    "<code>class</code> declarations are hoisted like <code>let</code>/<code>const</code> — they exist in the temporal dead zone, so you can't instantiate a class before its definition line either.",
    "The TDZ applies per-block, which trips people up in <code>switch</code> statements — all <code>case</code>s share one block, so a <code>let</code> declared in one case is in the TDZ for every case above it."
  ],
  code:`console.log(x);   <span class="cm">// undefined, not an error</span>\nvar x = 5;\n\nconsole.log(y);   <span class="cm">// ReferenceError — temporal dead zone</span>\nlet y = 5;`,
  terms:[
    {term:"Hoisting", desc:"Declarations are processed before execution; only var initializes to undefined.", detail:"Function declarations are hoisted with their entire body attached — which is why you can call a function defined further down the same file.", code:`sayHi();  <span class="cm">// works — function is fully hoisted</span>\nfunction sayHi() { console.log('hi'); }`},
    {term:"Temporal dead zone", desc:"The span from scope start to declaration where let/const exist but can't be read.", detail:"The TDZ exists per-block, so the same variable name in a nested block has its own separate dead zone from an outer declaration.", code:`{\n  console.log(a);  <span class="cm">// ReferenceError, not undefined</span>\n  let a = 10;\n}`}
  ]
},
{ id:'proto', title:'Prototypes & inheritance', animate:'protochain',
  lede:"JS objects don't use classical inheritance — they link to each other via an internal prototype reference.",
  steps:[
    "Every object has an internal <code>[[Prototype]]</code> link (exposed as <code>__proto__</code>) pointing to another object.",
    "When you access a property, JS checks the object itself first, then walks up the <b>prototype chain</b> until it finds it or hits <code>null</code>.",
    "<code>class</code> syntax is <b>syntactic sugar</b> over this same prototype mechanism — it doesn't change how lookup works underneath.",
    "Methods defined on a class/constructor's <code>prototype</code> are shared across all instances, not copied per instance — saving memory.",
    "Built-in methods like <code>array.map()</code> or <code>string.slice()</code> aren't duplicated on every value either — they live once on <code>Array.prototype</code> / <code>String.prototype</code>.",
    "<code>hasOwnProperty()</code> checks only the object itself, ignoring the chain — useful for telling 'defined here' apart from 'inherited from somewhere up the chain'.",
    "<code>extends</code> in a class sets up the prototype link automatically; <code>super()</code> calls the parent constructor to initialize the inherited part of the object.",
    "Static methods (<code>static greet(){}</code>) live on the <b>constructor function itself</b>, not on <code>prototype</code> — that's why they're inherited through the constructor chain, not through instances."
  ],
  code:`function Dog(name) { this.name = name; }\nDog.prototype.bark = function() { return this.name + ' barks'; };\nconst d = new Dog('Rex');\nd.bark(); <span class="cm">// found on Dog.prototype, not on d itself</span>`,
  terms:[
    {term:"Prototype chain", desc:"The linked path of [[Prototype]] references used for property lookup.", detail:"The chain always terminates at Object.prototype, then null — that final null is why the lookup eventually stops instead of looping forever.", code:`const arr = [1,2,3];\narr.__proto__ === Array.prototype;              <span class="cm">// true</span>\nArray.prototype.__proto__ === Object.prototype; <span class="cm">// true</span>`},
    {term:"Object.create()", desc:"Creates an object with a specific prototype directly.", detail:"It's the most explicit way to set up prototypal inheritance without going through a constructor function or class at all.", code:`const animal = { speak(){ return 'some sound'; } };\nconst dog = Object.create(animal);\ndog.speak();  <span class="cm">// 'some sound' — found via the prototype link</span>`}
  ]
},
{ id:'this', title:"The 'this' keyword", animate:'thisflip',
  lede:"'this' is not fixed at write-time (except for arrow functions) — it's determined by how a function is called.",
  steps:[
    "<b>Plain call</b> (<code>fn()</code>): 'this' is <code>undefined</code> in strict mode, or the global object otherwise.",
    "<b>Method call</b> (<code>obj.fn()</code>): 'this' is the object left of the dot at call time.",
    "<b>Constructor call</b> (<code>new Fn()</code>): 'this' is the newly created object.",
    "<b>Arrow functions</b> don't have their own 'this' — they capture it lexically from the enclosing scope, permanently.",
    "This is exactly why arrow functions are the default choice for callbacks inside class methods — no <code>.bind(this)</code> needed.",
    "<code>call()</code> and <code>apply()</code> both invoke a function immediately with an explicit 'this' — the only difference is how the remaining arguments are passed (list vs array).",
    "In event handlers, DOM APIs typically set 'this' to the element the handler was attached to — another form of implicit binding worth knowing separately from method calls.",
    "An arrow function defined <i>inside</i> a regular method still inherits 'this' from that method's call — which is exactly why arrows fix the classic 'this is undefined inside my callback' bug without needing <code>const self = this</code>."
  ],
  code:`const obj = {\n  name: 'A',\n  normal() { return this.name; },      <span class="cm">// 'A' — obj called it</span>\n  arrow: () => this?.name              <span class="cm">// undefined — lexical 'this'</span>\n};`,
  terms:[
    {term:"Implicit binding", desc:"'this' set by the object a method is called on.", detail:"The binding is decided purely by the syntax at the call site (what's left of the dot) — not by where or how the function was originally defined.", code:`const user = { name: 'Kai', greet(){ return this.name; } };\nuser.greet();  <span class="cm">// 'Kai' — implicit binding to user</span>`},
    {term:"Explicit binding", desc:"Set manually via call(), apply(), or bind().", detail:"bind() is unique among the three — it doesn't call the function immediately, it returns a brand-new function with 'this' permanently fixed.", code:`function greet(){ return this.name; }\nconst user = { name: 'Kai' };\ngreet.call(user);          <span class="cm">// 'Kai' — runs immediately</span>\nconst bound = greet.bind(user);\nbound();                   <span class="cm">// 'Kai' — this locked forever</span>`}
  ]
},
{ id:'loop-js', title:'Event loop in the browser', animate:'loop',
  lede:"In the browser, the JS engine (call stack + heap) is paired with Web APIs the engine itself doesn't implement.",
  steps:[
    "The <b>JS engine</b> runs your code on a single call stack — it cannot do networking, timers, or DOM events itself.",
    "Async operations (<code>fetch</code>, <code>setTimeout</code>, DOM listeners) are handed off to <b>Web APIs</b> provided by the browser.",
    "When those complete, their callbacks go into either the <b>macrotask queue</b> (timers, events) or the <b>microtask queue</b> (Promises).",
    "The <b>event loop</b> only pushes a queued callback onto the call stack once the stack is completely empty — and always drains all microtasks before the next macrotask.",
    "<code>requestAnimationFrame</code> is a third scheduling point — it runs after microtasks drain but right before the next repaint, separate from both queues.",
    "This is also why a long-running synchronous loop <b>freezes the whole page</b> — clicks, scrolling, and repaints all wait behind whatever's currently on the call stack.",
    "The Node.js event loop shares the same core idea but has explicit, ordered phases instead of just two flat queues — see the Node side for the full breakdown.",
    "The spec calls the point where microtasks drain a <b>'microtask checkpoint'</b> — it happens not just after the whole script, but after every single callback, including ones inside other callbacks."
  ],
  code:`console.log('A');\nsetTimeout(() => console.log('B'), 0);   <span class="cm">// macrotask</span>\nPromise.resolve().then(() => console.log('C')); <span class="cm">// microtask</span>\nconsole.log('D');\n<span class="cm">// output: A, D, C, B</span>`,
  terms:[
    {term:"Web APIs", desc:"Browser-provided capabilities (DOM, fetch, timers) outside the JS engine itself.", detail:"They run in the browser's own threads (or the network stack), which is exactly why they don't block your JS code while waiting.", code:`fetch('/api/data')          <span class="cm">// handled by the browser's network stack</span>\n  .then(res => res.json())  <span class="cm">// callback queued once it resolves</span>\n  .then(data => console.log(data));`},
    {term:"Event loop", desc:"The mechanism that moves queued callbacks onto the empty call stack.", detail:"It's not actually part of the JS engine (V8) — it's provided by the host environment, which is why Node and browsers implement it slightly differently.", code:`console.log('sync');\nsetTimeout(() => console.log('queued'), 0);\nconsole.log('sync again');\n<span class="cm">// sync, sync again, queued — loop only runs once stack is empty</span>`}
  ]
},
{ id:'tasks', title:'Microtasks vs macrotasks', animate:'taskqueue',
  lede:"This distinction alone accounts for a large share of 'predict the output' interview questions.",
  steps:[
    "<b>Macrotasks</b>: <code>setTimeout</code>, <code>setInterval</code>, UI rendering, I/O events — one runs per loop iteration.",
    "<b>Microtasks</b>: Promise <code>.then/.catch/.finally</code>, <code>queueMicrotask</code> — much higher priority.",
    "After <b>every single task</b> (not just once per loop), the engine fully drains the microtask queue before doing anything else.",
    "This means a chain of <code>.then()</code> calls can keep running before a single <code>setTimeout</code> ever fires, even a 0ms one.",
    "<code>queueMicrotask(fn)</code> lets you schedule a microtask directly, without wrapping anything in a Promise first.",
    "<code>async</code>/<code>await</code> is built on this same queue — everything after an <code>await</code> resumes as a microtask, which is why <code>await</code>-heavy code can still starve macrotasks if chained aggressively.",
    "In Node.js, <code>process.nextTick</code> sits in an even higher-priority lane <i>above</i> Promise microtasks — see the Node side for that distinction.",
    "Browsers guard against total starvation by yielding to rendering periodically even under heavy microtask pressure — but relying on that instead of writing sane async code is a fragile habit."
  ],
  code:`Promise.resolve().then(() => {\n  console.log('1');\n  Promise.resolve().then(() => console.log('2'));\n});\nsetTimeout(() => console.log('3'), 0);\n<span class="cm">// output: 1, 2, 3 — nested microtasks still beat the timer</span>`,
  terms:[
    {term:"Starvation risk", desc:"Endlessly chained microtasks can delay macrotasks (rendering, timers) indefinitely.", detail:"This isn't just theoretical — a bug where a promise chain keeps re-queuing itself can visibly freeze a page's rendering while the JS thread stays 'busy' the whole time.", code:`function loopForever() {\n  Promise.resolve().then(loopForever);  <span class="cm">// re-queues itself every time</span>\n}\nloopForever();\nsetTimeout(() => console.log('never runs'), 0);  <span class="cm">// starved</span>`}
  ]
},
{ id:'gc', title:'Garbage collection', animate:'sweep',
  lede:"JS memory is managed automatically — but understanding the algorithm explains why some memory leaks happen.",
  steps:[
    "Modern engines use <b>mark-and-sweep</b>: starting from 'roots' (global object, currently executing functions), the GC marks every object reachable by reference.",
    "Anything <b>not marked</b> — unreachable from any root — is considered garbage and its memory is freed.",
    "Common leak source: a forgotten reference (e.g. a growing array, an event listener never removed, a closure holding a large object) keeps something 'reachable' forever.",
    "<b>Reference counting</b> is an older alternative approach (still used in some engines for certain cases) but can't handle circular references without extra help.",
    "<code>WeakMap</code>/<code>WeakSet</code> hold <b>weak references</b> — their entries don't stop keys from being garbage collected, which makes them ideal for caches and metadata.",
    "V8 actually runs GC in <b>generations</b> — a fast 'young generation' sweep for short-lived objects, and a slower, less frequent 'old generation' sweep for objects that survive multiple rounds.",
    "You can't force garbage collection deterministically from normal JS code — setting a reference to <code>null</code> only makes an object <i>eligible</i> for collection, not immediately freed.",
    "V8's heap size is capped by default (historically ~1.5-2GB for old-space) — long-running Node processes that leak memory will eventually hit <code>'JavaScript heap out of memory'</code> rather than growing forever."
  ],
  code:`let obj = { big: new Array(1e6) };\nobj = null;  <span class="cm">// no more references → eligible for GC</span>`,
  terms:[

/* ---------- render ---------- */
let currentTab = 'js';
let currentIndex = 0;

function topicsFor(tab){ return tab==='js' ? jsTopics : nodeTopics; }

function renderSidebar(){
  const topics = topicsFor(currentTab);
  document.getElementById('sidebar').innerHTML = topics.map((t,idx)=>
    `<button class="side-item ${currentTab}${idx===currentIndex?' active':''}" data-idx="${idx}"><span class="n">${String(idx+1).padStart(2,'0')}</span>${t.title}${t.type==='demo'?'<span class="play-badge">▶ play</span>':''}</button>`
  ).join('');
  document.querySelectorAll('.side-item').forEach(btn=>{
    btn.onclick = ()=>{ currentIndex = Number(btn.dataset.idx); renderAll(); };
  });
}

function renderSections(){
  const topics = topicsFor(currentTab);
  const t = topics[currentIndex];

  if(t.type === 'demo'){
    document.getElementById('sections').innerHTML = `
      <div class="section active">
        <div class="eyebrow ${currentTab}">${currentTab==='js' ? 'JavaScript engine' : 'Node.js runtime'} — interactive demo</div>
        <h2>${t.title}</h2>
        <p class="lede">${t.demo==='js' ? "Step through (or play) real code and watch the call stack, heap allocation, and the microtask/macrotask queues move together." : "Step through (or play) a script that fires an API request and a file read, and watch exactly which subsystem — kernel, thread pool, or queue — handles each one."}</p>
        ${buildDemoMarkup(t.demo)}
      </div>`;
    initDemo(t.demo);
    return;
  }

  document.getElementById('sections').innerHTML = `
    <div class="section active">
      <div class="eyebrow ${currentTab}">${currentTab==='js' ? 'JavaScript engine' : 'Node.js runtime'} — topic ${currentIndex+1} of ${topics.length}</div>
      <h2>${t.title}</h2>
      <p class="lede">${t.lede}</p>
      <div class="visual">${animations[t.animate]}</div>
      <h3>How it works, step by step</h3>
      <ul class="steps">${t.steps.map(s=>`<li>${s}</li>`).join('')}</ul>
      <h3>Example</h3>
      <pre><code>${t.code}</code></pre>
      <h3>Key terms</h3>
      <div class="term-grid">${t.terms.map(term=>`
        <details class="term">
          <summary>
            <span class="t-head"><b>${term.term}</b></span>
            <span class="t-desc">${term.desc}</span>
          </summary>
          <div class="term-expand">
            <p>${term.detail}</p>
            <pre><code>${term.code}</code></pre>
          </div>
        </details>`).join('')}</div>
    </div>`;
}

function renderTabs(){
  document.getElementById('tabJS').classList.toggle('active', currentTab==='js');
  document.getElementById('tabNode').classList.toggle('active', currentTab==='node');
}

function renderFooter(){
  const topics = topicsFor(currentTab);
  const isFirst = currentIndex===0 && currentTab==='js';
  const isLast = currentIndex===topics.length-1 && currentTab==='node';
  const prevBtn = document.getElementById('prevSec');
  const nextBtn = document.getElementById('nextSec');
  prevBtn.disabled = isFirst;
  nextBtn.disabled = isLast;
  nextBtn.textContent = isLast ? "You've reached the last topic" : 'Next topic →';
}

function renderAll(){
  renderTabs();
  renderSidebar();
  renderSections();
  renderFooter();
  window.scrollTo({top:0, behavior:'smooth'});
}

document.getElementById('tabJS').onclick = ()=>{ currentTab='js'; currentIndex=0; renderAll(); };
document.getElementById('tabNode').onclick = ()=>{ currentTab='node'; currentIndex=0; renderAll(); };

document.getElementById('prevSec').onclick = ()=>{
  if(currentIndex>0){ currentIndex--; }
  else if(currentTab==='node'){ currentTab='js'; currentIndex=jsTopics.length-1; }
  renderAll();
};

/* --- 3. readFileSync blocks the single thread --- */
const nodeBlockCode = [

  `console.log(<span class="str">'request A: done'</span>);`,
  ``,
  `console.log(<span class="str">'request B: start'</span>);  <span class="cm">// has to wait its turn</span>`

const nodeScenarios = [
  {key:'core',   label:'Full event loop + API request',        code:nodeCoreCode,   steps:nodeCoreSteps,   phases:nodePhaseDefs},
  {key:'tick',   label:'process.nextTick starvation',           code:nodeTickCode,   steps:nodeTickSteps,   phases:nodePhaseDefs},
  {key:'block',  label:'readFileSync blocks everything',        code:nodeBlockCode,  steps:nodeBlockSteps,  phases:nodePhaseDefs},
  {key:'reject', label:'Unhandled rejection in an async route', code:nodeRejectCode, steps:nodeRejectSteps, phases:nodePhaseDefs}
];

const demoState = {
  js:   { scenarios: jsScenarios,   scenarioIndex:0, i:0, playing:false, timer:null },
  node: { scenarios: nodeScenarios, scenarioIndex:0, i:0, playing:false, timer:null }
};
function curScenario(kind){ const s = demoState[kind]; return s.scenarios[s.scenarioIndex]; }

function buildDemoMarkup(kind){
  const isNode = kind==='node';
  const scenarios = demoState[kind].scenarios;
  const activeIdx = demoState[kind].scenarioIndex;
  const chips = scenarios.map((sc,idx)=>
    `<button class="scenario-chip${idx===activeIdx?' active':''}" data-kind="${kind}" data-idx="${idx}">${sc.label}</button>`
  ).join('');
  return `
    <div class="scenario-picker">${chips}</div>
    <div class="dp-layout">
      <div class="dp-code" id="dpCode-${kind}"></div>
      <div>
        <div class="dp-ring" id="dpRing-${kind}"></div>
        <div class="dp-row ${isNode?'three':''}">
          <div class="dp-card"><h4><span class="dp-dot" style="background:var(--accent)"></span>Call stack</h4><div class="dp-items" id="dpStack-${kind}"></div></div>
          ${isNode ? `
          <div class="dp-card"><h4><span class="dp-dot" style="background:var(--pool)"></span>Thread pool</h4><div class="dp-workers" id="dpWorkers-${kind}"></div><div class="dp-items" id="dpPool-${kind}"></div></div>
          <div class="dp-card"><h4><span class="dp-dot" style="background:var(--node)"></span>OS kernel — network</h4><div class="dp-items" id="dpKernel-${kind}"></div></div>` : `
          <div class="dp-card"><h4><span class="dp-dot" style="background:var(--node)"></span>Heap (memory)</h4><div class="dp-items" id="dpHeap-${kind}"></div></div>`}
        </div>
        <div class="dp-row ${isNode?'three':''}">
          ${isNode ? `<div class="dp-card"><h4><span class="dp-dot" style="background:var(--tick)"></span>nextTick queue</h4><div class="dp-items" id="dpTick-${kind}"></div></div>` : ''}
          <div class="dp-card"><h4><span class="dp-dot" style="background:var(--micro)"></span>Microtask queue</h4><div class="dp-items" id="dpMicro-${kind}"></div></div>
          <div class="dp-card"><h4><span class="dp-dot" style="background:var(--js)"></span>${isNode?'Timers / check':'Macrotask queue'}</h4><div class="dp-items" id="dpMacro-${kind}"></div></div>
        </div>
        <div class="dp-console" id="dpConsole-${kind}"></div>
        <div class="dp-note" id="dpNote-${kind}"></div>
        <div class="dp-progress"><div class="dp-progress-fill" id="dpProgress-${kind}"></div></div>
        <div class="dp-controls">
          <button id="dpPrev-${kind}">Back</button>
          <button id="dpNext-${kind}" class="primary">Next</button>
          <button id="dpPlay-${kind}">▶ Play</button>
          <button id="dpReset-${kind}">Reset</button>
          <span class="dp-step-count" id="dpCount-${kind}"></span>
        </div>
        <div class="dp-legend">
          <span><i style="background:var(--accent)"></i>call stack</span>
          ${isNode ? `<span><i style="background:var(--pool)"></i>thread pool (fs/dns/crypto)</span><span><i style="background:var(--node)"></i>OS kernel (network)</span><span><i style="background:var(--tick)"></i>nextTick</span>` : `<span><i style="background:var(--node)"></i>heap</span>`}
          <span><i style="background:var(--micro)"></i>microtasks</span>
        </div>
      </div>
    </div>`;
}

function switchScenario(kind, idx){
  stopDemo(kind);
  demoState[kind].scenarioIndex = idx;
  demoState[kind].i = 0;
  renderSections();
}

function initDemo(kind){
  const s = demoState[kind];
  s.i = 0; s.playing = false; clearInterval(s.timer);
  const sc = curScenario(kind);
  document.getElementById(`dpCode-${kind}`).innerHTML = sc.code.map((l,idx)=>`<div class="dp-code-line" data-i="${idx}">${l||'&nbsp;'}</div>`).join('');
  renderDemo(kind);
  document.querySelectorAll(`.scenario-chip[data-kind="${kind}"]`).forEach(btn=>{
    btn.onclick = ()=> switchScenario(kind, Number(btn.dataset.idx));
  });
  document.getElementById(`dpPrev-${kind}`).onclick = ()=>{ stopDemo(kind); stepDemo(kind,-1); };
  document.getElementById(`dpNext-${kind}`).onclick = ()=>{ stopDemo(kind); stepDemo(kind,1); };
  document.getElementById(`dpReset-${kind}`).onclick = ()=>{ stopDemo(kind); s.i=0; renderDemo(kind); };
  document.getElementById(`dpPlay-${kind}`).onclick = ()=> s.playing ? stopDemo(kind) : startDemo(kind);
}

function stepDemo(kind, dir){
  const s = demoState[kind];
  const steps = curScenario(kind).steps;
  s.i = Math.max(0, Math.min(steps.length-1, s.i+dir));
  renderDemo(kind);
  if(s.i === steps.length-1) stopDemo(kind);
}
function startDemo(kind){
  const s = demoState[kind];
  s.playing = true;
  document.getElementById(`dpPlay-${kind}`).textContent = '⏸ Pause';
  s.timer = setInterval(()=>{
    const steps = curScenario(kind).steps;
    if(s.i >= steps.length-1){ stopDemo(kind); return; }
    stepDemo(kind, 1);
  }, 2300);
}
function stopDemo(kind){
  const s = demoState[kind];
  s.playing = false;
  const btn = document.getElementById(`dpPlay-${kind}`);
  if(btn) btn.textContent = '▶ Play';
  clearInterval(s.timer);
}

function renderDemo(kind){
  const s = demoState[kind];
  const sc = curScenario(kind);
  const step = sc.steps[s.i];
  const isNode = kind==='node';

  document.querySelectorAll(`#dpCode-${kind} .dp-code-line`).forEach(el=>{
    el.classList.toggle('active', Number(el.dataset.i) === step.line);
  });

  document.getElementById(`dpRing-${kind}`).innerHTML = sc.phases.map(p=>{
    const on = p.k === step.phase;
    const colorMap = {run:'accent',idle:'sub',micro:'micro',macro:'js',timers:'js',pending:'pool',poll:'node',check:'tick',close:'micro'};
    const varName = colorMap[p.k] || 'accent';
    return `<div class="dp-phase${on?' on':''}" style="${on?`background:var(--${varName});color:#0D1013;`:''}">${p.label}</div>`;
  }).join('');

  document.getElementById(`dpStack-${kind}`).innerHTML = step.stack.length ? step.stack.join('') : dpEmpty;
  document.getElementById(`dpMicro-${kind}`).innerHTML = step.micro.length ? step.micro.join('') : dpEmpty;
  document.getElementById(`dpMacro-${kind}`).innerHTML = step.macro.length ? step.macro.join('') : dpEmpty;

  if(isNode){
    document.getElementById(`dpPool-${kind}`).innerHTML = step.pool.length ? step.pool.join('') : dpEmpty;
    document.getElementById(`dpWorkers-${kind}`).innerHTML = step.poolW.map((b,idx)=>`<div class="dp-worker ${b?'busy':''}">W${idx+1}${b?' •':''}</div>`).join('');
    document.getElementById(`dpKernel-${kind}`).innerHTML = step.kernel.length ? step.kernel.join('') : dpEmpty;
    document.getElementById(`dpTick-${kind}`).innerHTML = step.tick.length ? step.tick.join('') : dpEmpty;
  } else {
    document.getElementById(`dpHeap-${kind}`).innerHTML = step.heap.length ? step.heap.join('') : dpEmpty;
  }

  document.getElementById(`dpConsole-${kind}`).innerHTML = step.out.length
    ? step.out.map((o,idx)=>`<div class="r${idx===step.out.length-1?' new':''}">&gt; <span>${o}</span></div>`).join('')
    : '<div class="r" style="opacity:.5">console output will appear here</div>';

  document.getElementById(`dpNote-${kind}`).innerHTML = step.note;
  document.getElementById(`dpCount-${kind}`).textContent = `Step ${s.i+1} / ${sc.steps.length}`;
  document.getElementById(`dpProgress-${kind}`).style.width = `${((s.i+1)/sc.steps.length)*100}%`;
  document.getElementById(`dpPrev-${kind}`).disabled = s.i===0;
  document.getElementById(`dpNext-${kind}`).disabled = s.i===sc.steps.length-1;
}
/* ================= END DEMO PLAYER ================= */

renderAll();
</script>
</body>
</html>
